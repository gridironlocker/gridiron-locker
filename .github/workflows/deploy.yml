name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Rebuild private Customer Finder
        env:
          CF_CODE: ${{ secrets.CF_CODE }}
        if: env.CF_CODE != ''
        run: |
          node radar/static-finder/build.mjs
          echo "Private Customer Finder rebuilt from current engine sources."
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
