name: scratch-recon
on:
  workflow_dispatch:
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: pip install --quiet requests beautifulsoup4 lxml
      - name: recrawl
        run: |
          python scrape_list.py || echo LIST_FAILED
          python scrape_products.py || echo PRODUCTS_FAILED
          python dl.py || echo DL_FAILED
      - name: snapshot-before-replay
        run: |
          mkdir -p /tmp/pre
          cp data/*.json /tmp/pre/
          cp -r site/img/p /tmp/pre/img-p || true
      - name: replay
        run: |
          python replay_updates.py || echo REPLAY_FAILED
          python dl.py || echo DL_AFTER_REPLAY_FAILED
      - name: report
        run: |
          python - <<'PY'
          import json
          c = json.load(open('data/collections.json'))
          pre = json.load(open('/tmp/pre/collections.json'))
          targets = ['let-it-rip','sanders-the-next-level','limited-edition-m-vs-all','limited-edition-qb19']
          now = {p['slug'] for col in c.values() for p in col['products']}
          before = {p['slug'] for col in pre.values() for p in col['products']}
          print('BEFORE-REPLAY-CRAWL total:', sum(len(col['products']) for col in pre.values()))
          for t in targets:
              print(t, 'present-after-scrape:', t in before)
          print('AFTER-REPLAY total:', len(now), 'targets:', [t for t in targets if t in now])
          live = json.load(open('data/products_live.json'))
          print('live total:', len(live), 'target imgs:', [t for t in targets if live.get(t, {}).get('img', {}).get('front')])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recon-output
          path: |
            /tmp/pre/
            data/
            site/img/p/
          if-no-files-found: ignore
