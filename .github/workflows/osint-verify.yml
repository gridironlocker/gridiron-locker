name: OSINT pipeline verification

# Verifies the private prospect engine (marketing/osint/) — on every change
# to it, and on demand. Two halves:
#
#   1. the offline test suite (mock fixtures, no network);
#   2. a small REAL live discovery run into a THROWAWAY database on the
#      runner (which has full network), printing aggregate counts and masked
#      emails only.
#
# This repository is PUBLIC: prospect lists and emails must never be
# committed, uploaded as artifacts, or printed in logs. This workflow
# therefore stores nothing — the live run's database lives in a temp
# directory that is destroyed with the runner. Its purpose is to prove the
# live data pipeline works (real public sources, real parsing, real scoring)
# between the owner's local collection runs.
#
# It is deliberately NOT scheduled and does NOT join the pages-deploy
# concurrency group: it commits and deploys nothing.

on:
  workflow_dispatch:
    inputs:
      max_queries:
        description: "Queries per team for the live run"
        required: false
        default: "2"
  push:
    paths:
      - marketing/osint/**
      - tests/test_osint_prospect_engine.py
      - .github/workflows/osint-verify.yml

permissions:
  contents: read

concurrency:
  group: osint-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline tests (mock fixtures, no network, no repo mutation)
        run: python3 -m unittest tests.test_osint_prospect_engine -v

      - name: Full repository suite (the engine must not break anything)
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Pipeline health checks
        run: python3 -m marketing.osint verify

      - name: Live smoke run (real public sources, throwaway database)
        env:
          # belt and braces: even if the live run ignored its temp state,
          # these point outside the checkout's tracked tree
          OSINT_STATE_DIR: /tmp/osint-live-state
          OSINT_EXPORTS_DIR: /tmp/osint-live-exports
        run: |
          set -o pipefail
          python3 -m marketing.osint verify --live \
            --max-queries "${{ github.event.inputs.max_queries || '2' }}" \
            | tee osint-live-report.txt

      - name: Summarise
        if: always()
        run: |
          {
            echo "### OSINT pipeline verification"
            echo
            echo '```'
            tail -n 60 osint-live-report.txt 2>/dev/null || echo "no live report produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # NOTE: no artifact upload step. The live report stays in the job log,
      # and it contains aggregates and masked emails only.
