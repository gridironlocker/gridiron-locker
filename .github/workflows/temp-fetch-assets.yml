name: Temp fetch assets
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temp-fetch-assets
  cancel-in-progress: false

jobs:
  fetch:
    # Only act on PRs from our working branch.
    if: ${{ github.head_ref == 'arena/01a074d4-gridiron-locker' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests Pillow

      - name: Download campaign mockups for second-act-qb19-limited-edition
        run: |
          python - <<'PY'
          import json, os, requests
          from concurrent.futures import ThreadPoolExecutor
          from PIL import Image

          SLUG = "second-act-qb19-limited-edition"
          extra = json.load(open("data/campaigns_extra.json"))
          c = extra[SLUG]
          cid, base = c["campaign"], c["base"]
          design = base.split("-")[0]
          asset = f"https://assets.viralstyle.com/campaigns/{cid}/"

          urls = [("front", base + "-front-large.jpg"), ("back", base + "-back-large.jpg")]
          for i, k in enumerate(c["swatch_keys"][:6]):
              kk = k if k.startswith(design + "-") else f"{design}-{k}"
              urls.append((f"c{i}", kk + "-front-large.jpg"))

          os.makedirs("site/img/p", exist_ok=True)
          S = requests.Session()
          S.headers.update({"User-Agent": "Mozilla/5.0"})

          def to_webp(fn):
              webp = fn[:-4] + ".webp"
              Image.open(fn).convert("RGB").save(webp, "WEBP", quality=82, method=6)
              os.remove(fn)
              return webp

          def go(j):
              tag, fn_suffix = j
              fn = f"site/img/p/{SLUG}-{tag}.jpg"
              for u in (asset + fn_suffix,
                        asset + fn_suffix.replace("-front-large", "-front-small"),
                        asset + fn_suffix.replace("-front-large", "-front")):
                  try:
                      r = S.get(u, timeout=90)
                      if r.status_code == 200 and len(r.content) > 3000:
                          open(fn, "wb").write(r.content)
                          to_webp(fn)
                          print(f"{tag}: ok  ({u})")
                          return 1
                  except Exception as e:
                      print(f"{tag}: retry ({e})")
              print(f"{tag}: FAILED")
              return 0

          with ThreadPoolExecutor(max_workers=8) as ex:
              ok = sum(ex.map(go, urls))
          print(f"downloaded {ok}/{len(urls)}")
          if ok < len(urls):
              raise SystemExit("some mockups failed to download")
          PY

      - name: Commit and push images to the session branch
        run: |
          git config user.name  "gridiron-bot"
          git config user.email "actions@github.com"
          git fetch origin arena/01a074d4-gridiron-locker
          git checkout arena/01a074d4-gridiron-locker
          git add site/img/p/second-act-qb19-limited-edition-*.webp
          git diff --staged --quiet && { echo "No images."; exit 0; }
          git commit -m "Fetch mockup images for second-act-qb19-limited-edition"
          git push origin HEAD:arena/01a074d4-gridiron-locker
