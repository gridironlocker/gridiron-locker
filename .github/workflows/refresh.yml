name: Refresh trends & redeploy

on:
  schedule:
    - cron: "15 6 * * *"
    - cron: "15 15 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with deploy.yml so the two workflows cannot deploy Pages at the same
# time - see the comment there. Previously this was `group: refresh`, which
# only excluded other refresh runs and left deploy.yml free to race it.
#
# The name still serialises refresh against itself (a slow scrape cannot be
# overlapped by the next cron tick), which is what `refresh` was for.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message || '', 'Auto-refresh') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4 lxml Pillow

      - name: Re-crawl product catalogue
        continue-on-error: true
        run: |
          echo "Re-crawling Viralstyle..."
          python scrape_list.py || echo "list crawl failed, keeping existing data"
          python scrape_products.py || echo "product crawl failed, keeping existing data"
          # The four hand-added campaigns are live on Viralstyle but are not
          # members of the store's collection listing pages, so a successful
          # scrape_list/scrape_products would drop them. Re-injecting the
          # idempotent replay keeps them in the catalogue every refresh.
          python replay_updates.py || echo "replay injection failed, keeping existing data"
          python dl.py || echo "image download failed, keeping existing images"

      - name: Refresh trend data
        run: python src/trends.py

      - name: Verify trend data is fresh
        run: |
          python - <<'PY'
          import json, datetime, sys
          data = json.load(open("data/trends.json"))
          today = datetime.date.today().isoformat()
          gen = data.get("generated", "?")
          total = sum(len(c.get("headlines", [])) for c in data.get("collections", {}).values())
          print(f"trend data generated: {gen} (today: {today}), {total} headlines captured")
          if gen != today:
              sys.exit(f"STALE: data/trends.json was not regenerated today ({gen} != {today})")
          if total == 0:
              sys.exit("EMPTY: all feeds returned zero headlines - refusing to publish an emptied site")
          PY

      - name: Collect public web and social trend signals
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python marketing/social_watch.py

      - name: Build three-day marketing pulse
        run: |
          python marketing/plan.py
          python marketing/live_engine.py
          python marketing/commercial_agent.py
          python marketing/three_day_pulse.py

      - name: Publish approved three-day pulse (dry-run unless explicitly enabled)
        continue-on-error: true
        env:
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          PUBLISH_APPROVED: ${{ vars.PUBLISH_APPROVED }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python marketing/publisher.py --publish

      - name: Rebuild site
        run: python src/build.py

      - name: Verify rebuild is sane
        run: |
          python - <<'PY'
          import json, os, re, sys
          # 1) Catalogue size - read the MASTER catalogue, not one crawl file.
          # data/products_live.json is only the Viralstyle half: Cleveland and
          # Michigan are sourced from data/mayzing_products.json and
          # data/mayzing_michigan.json. Counting that one file reported 113
          # while the site actually builds 81, so the gate was policing a
          # number no page agrees with. src/build.py merges all three.
          sys.path.insert(0, "src")
          import build
          nprod = len(build.ALL)
          per = ", ".join(f"{k}={len(v)}" for k, v in build.MODEL.items())
          print(f"catalogue: {nprod} products ({per})")
          if nprod < 50:
              sys.exit(f"FAIL: only {nprod} products (< 50) - refusing to publish")
          # 2) Sitemap depth - the sitemap is produced by the same build, so it
          # must match the catalogue exactly rather than clear a magic floor.
          # (build.URLS is only filled while main() runs, so the check reads
          # the file the build just wrote.)
          sm = open("site/sitemap.xml", encoding="utf-8").read()
          locs = re.findall(r"<loc>([^<]+)</loc>", sm)
          nlocs = len(locs)
          nshop = len([u for u in locs if "/shop/" in u])
          print(f"site/sitemap.xml: {nlocs} <loc> urls, {nshop} products")
          if nshop != nprod:
              sys.exit(f"FAIL: sitemap has {nshop} product URLs but the catalogue "
                       f"holds {nprod} - refusing to publish")
          if nlocs < nprod + 10:
              sys.exit(f"FAIL: only {nlocs} sitemap <loc> urls for {nprod} "
                       f"products - refusing to publish")
          if len(set(locs)) != nlocs:
              sys.exit("FAIL: sitemap contains duplicate <loc> entries - refusing to publish")
          # 3) No missing local refs across every built page
          attr = re.compile(r'(?:src|data-src|href|content)="([^"]+)"')
          missing = []
          for base, _, files in os.walk("site"):
              for f in files:
                  if not f.endswith(".html"):
                      continue
                  fp = os.path.join(base, f)
                  rel = os.path.relpath(fp, "site")
                  text = open(fp, encoding="utf-8", errors="replace").read()
                  for m in attr.finditer(text):
                      val = m.group(1).strip()
                      if val.startswith("//") or not (val.startswith("/") or val.startswith("../")):
                          continue
                      val = val.split("#")[0].split("?")[0]
                      if val in ("", "/"):
                          continue
                      if val.startswith("/"):
                          cand = os.path.normpath(os.path.join("site", val.lstrip("/")))
                      else:
                          cand = os.path.normpath(os.path.join(os.path.dirname(fp), val))
                      if os.path.isdir(cand):
                          cand = os.path.join(cand, "index.html")
                      if not os.path.isfile(cand):
                          missing.append(f'{rel}: "{val}"')
          if missing:
              for x in missing[:40]:
                  print("MISSING REF:", x)
              sys.exit(f"FAIL: {len(missing)} missing local ref(s) - refusing to publish")
          print("OK: rebuild is sane (products, sitemap, no missing local refs)")
          PY

      - name: Run the guard-rail test suite (gates the commit and the deploy)
        run: |
          # tests/test_layout.py reads the site/ this run just rebuilt, so it
          # must run here - after the rebuild, before the commit. Until now the
          # suite only ran in health-check.yml at 07:45 UTC, i.e. *after* the
          # storefront had already been published, so a layout regression went
          # live and was reported as a production failure the next morning.
          #
          # The step above checks the catalogue/sitemap mechanically; this one
          # checks the 118 layout, copy and merchant-schema rules the README
          # promises (no mini-checkout controls, no fabricated ratings, no
          # invented colour names, partner-scoped shipping claims, ...).
          #
          # The marketing generator tests run inside a throwaway copy of the
          # repo (tests/testutil.py) and cannot touch tracked files, so this
          # step adds nothing to the `git add -A` below.
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Commit changes
        id: commit
        run: |
          git config user.name  "gridiron-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Nothing changed."
          else
            git commit -m "Auto-refresh: trends + rebuild $(date -u +%Y-%m-%d)"
            # Remember where main was before integrating, so a conflict can be
            # reported as "these are the commits that landed", not just a diff.
            git fetch --quiet origin main
            REMOTE_BEFORE="$(git rev-parse origin/main)"
            # Integrate anything that landed on main since checkout.
            #
            # This used to be `git pull --rebase -X theirs`, and -X theirs is a
            # data-loss switch: it auto-resolves every conflicting hunk in
            # favour of the remote, silently, with no conflict and no non-zero
            # exit. This job commits with `git add -A` across the whole repo, so
            # the moment a refresh overlaps a hand-edit to src/catalog.py copy
            # facts, data/creators.json (Joe's picks and commission rate) or any
            # design doc, the human's work is dropped and the commit still
            # succeeds. Nobody sees it happen.
            #
            # Now a genuine conflict fails the run loudly and prints exactly
            # which files need a human. The storefront has already been
            # rebuilt, verified and deployed by the steps above, so a failure
            # here loses only the commit - not the publish.
            if ! git pull --rebase origin main; then
              echo "::error::Auto-refresh could not rebase onto origin/main - a human edit conflicts with this refresh. Resolve it by hand; nothing was force-resolved and nothing was pushed."
              echo
              echo "Conflicting paths:"
              git diff --name-only --diff-filter=U | sed 's/^/  - /'
              echo
              echo "What landed on origin/main since this run checked out:"
              git --no-pager log --oneline "${REMOTE_BEFORE}..origin/main" | sed 's/^/  /' || true
              git rebase --abort
              exit 1
            fi
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Nudge Google (GSC live inspection + WebSub)
        continue-on-error: true
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
        run: |
          pip install --quiet google-auth requests
          if [ -n "$GSC_SA_JSON" ]; then
            echo "$GSC_SA_JSON" > /tmp/gsc-sa.json
            export GSC_SA_JSON_PATH=/tmp/gsc-sa.json
          fi
          python src/nudge_google.py
      - name: Ping IndexNow
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: python src/indexnow.py

      - name: Verify the live site (production health check)
        # The steps above verified the build; this verifies the deploy - the
        # site as a customer sees it, over HTTPS, seconds after Pages went
        # live. Same checker as the "Daily site health check" workflow, which
        # also runs it on its own schedule and on demand.
        #
        # continue-on-error keeps the publish steps (already done) untouched
        # and lets the run reach the gate below, which is what actually marks
        # the run failed - so "the deploy went out" and "the deploy is
        # healthy" are separate, legible answers.
        id: livecheck
        continue-on-error: true
        run: |
          python3 ops/health_check.py --base https://gridironlocker.store | tee live-health.txt

      - name: Publish the live health report in the run summary
        if: always()
        run: |
          {
            echo "### Live site health check (post-deploy): ${{ steps.livecheck.outcome }}"
            echo
            echo '```'
            tail -n 30 live-health.txt 2>/dev/null || echo "check did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the live health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The outcome is in the name so the verdict is readable from the
          # run's artifact list without downloading anything.
          name: live-health-${{ steps.livecheck.outcome || 'not-run' }}
          path: live-health.txt
          if-no-files-found: ignore

      - name: Live health gate
        # A red run here means one thing: the site published, and the live
        # check found something wrong with it. Nothing is rolled back - the
        # store is already live - so this is a "go look now" signal.
        if: steps.livecheck.outcome == 'failure'
        run: |
          echo "::error::The live site failed its post-deploy health check. See the step log above."
          exit 1

      - name: Upload trend report
        uses: actions/upload-artifact@v4
        with:
          name: trend-report
          path: trend-report.md
          if-no-files-found: ignore
