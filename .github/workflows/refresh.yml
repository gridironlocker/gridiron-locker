name: Refresh trends & redeploy

on:
  schedule:
    - cron: "15 6 * * *"
    - cron: "15 15 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message || '', 'Auto-refresh') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4 lxml Pillow

      - name: Re-crawl product catalogue
        continue-on-error: true
        run: |
          echo "Re-crawling Viralstyle..."
          python scrape_list.py || echo "list crawl failed, keeping existing data"
          python scrape_products.py || echo "product crawl failed, keeping existing data"
          # The four hand-added campaigns are live on Viralstyle but are not
          # members of the store's collection listing pages, so a successful
          # scrape_list/scrape_products would drop them. Re-injecting the
          # idempotent replay keeps them in the catalogue every refresh.
          python replay_updates.py || echo "replay injection failed, keeping existing data"
          python dl.py || echo "image download failed, keeping existing images"

      - name: Refresh trend data
        run: python src/trends.py

      - name: Verify trend data is fresh
        run: |
          python - <<'PY'
          import json, datetime, sys
          data = json.load(open("data/trends.json"))
          today = datetime.date.today().isoformat()
          gen = data.get("generated", "?")
          total = sum(len(c.get("headlines", [])) for c in data.get("collections", {}).values())
          print(f"trend data generated: {gen} (today: {today}), {total} headlines captured")
          if gen != today:
              sys.exit(f"STALE: data/trends.json was not regenerated today ({gen} != {today})")
          if total == 0:
              sys.exit("EMPTY: all feeds returned zero headlines - refusing to publish an emptied site")
          PY

      - name: Rebuild site
        run: python src/build.py

      - name: Verify rebuild is sane
        run: |
          python - <<'PY'
          import json, os, re, sys
          # 1) Catalogue size
          live = json.load(open("data/products_live.json"))
          nprod = len(live)
          print(f"products_live.json: {nprod} products")
          if nprod < 50:
              sys.exit(f"FAIL: only {nprod} products (< 50) - refusing to publish")
          # 2) Sitemap depth
          sm = open("site/sitemap.xml", encoding="utf-8").read()
          nlocs = len(re.findall(r"<loc>", sm))
          print(f"site/sitemap.xml: {nlocs} <loc> urls")
          if nlocs < 100:
              sys.exit(f"FAIL: only {nlocs} sitemap <loc> urls (< 100) - refusing to publish")
          # 3) No missing local refs across every built page
          attr = re.compile(r'(?:src|data-src|href|content)="([^"]+)"')
          missing = []
          for base, _, files in os.walk("site"):
              for f in files:
                  if not f.endswith(".html"):
                      continue
                  fp = os.path.join(base, f)
                  rel = os.path.relpath(fp, "site")
                  text = open(fp, encoding="utf-8", errors="replace").read()
                  for m in attr.finditer(text):
                      val = m.group(1).strip()
                      if val.startswith("//") or not (val.startswith("/") or val.startswith("../")):
                          continue
                      val = val.split("#")[0].split("?")[0]
                      if val in ("", "/"):
                          continue
                      if val.startswith("/"):
                          cand = os.path.normpath(os.path.join("site", val.lstrip("/")))
                      else:
                          cand = os.path.normpath(os.path.join(os.path.dirname(fp), val))
                      if os.path.isdir(cand):
                          cand = os.path.join(cand, "index.html")
                      if not os.path.isfile(cand):
                          missing.append(f'{rel}: "{val}"')
          if missing:
              for x in missing[:40]:
                  print("MISSING REF:", x)
              sys.exit(f"FAIL: {len(missing)} missing local ref(s) - refusing to publish")
          print("OK: rebuild is sane (products, sitemap, no missing local refs)")
          PY

      - name: Commit changes
        id: commit
        run: |
          git config user.name  "gridiron-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Nothing changed."
          else
            git commit -m "Auto-refresh: trends + rebuild $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Nudge Google (GSC live inspection + WebSub)
        continue-on-error: true
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
        run: |
          pip install --quiet google-auth requests
          if [ -n "$GSC_SA_JSON" ]; then
            echo "$GSC_SA_JSON" > /tmp/gsc-sa.json
            export GSC_SA_JSON_PATH=/tmp/gsc-sa.json
          fi
          python src/nudge_google.py
      - name: Ping IndexNow
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: python src/indexnow.py

      - name: Upload trend report
        uses: actions/upload-artifact@v4
        with:
          name: trend-report
          path: trend-report.md
          if-no-files-found: ignore
