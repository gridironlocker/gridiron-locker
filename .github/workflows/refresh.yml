name: Refresh trends & redeploy

on:
  schedule:
    - cron: "15 6 * * *"
    - cron: "15 15 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message || '', 'Auto-refresh') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4 lxml

      - name: Re-crawl product catalogue
        continue-on-error: true
        run: |
          echo "Re-crawling Viralstyle..."
          python scrape_list.py || echo "list crawl failed, keeping existing data"
          python scrape_products.py || echo "product crawl failed, keeping existing data"
          python dl.py || echo "image download failed, keeping existing images"

      - name: Refresh trend data
        run: python src/trends.py

      - name: Verify trend data is fresh
        run: |
          python - <<'PY'
          import json, datetime, sys
          data = json.load(open("data/trends.json"))
          today = datetime.date.today().isoformat()
          gen = data.get("generated", "?")
          total = sum(len(c.get("headlines", [])) for c in data.get("collections", {}).values())
          print(f"trend data generated: {gen} (today: {today}), {total} headlines captured")
          if gen != today:
              sys.exit(f"STALE: data/trends.json was not regenerated today ({gen} != {today})")
          if total == 0:
              sys.exit("EMPTY: all feeds returned zero headlines - refusing to publish an emptied site")
          PY

      - name: Rebuild site
        run: python src/build.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name  "gridiron-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Nothing changed."
          else
            git commit -m "Auto-refresh: trends + rebuild $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Ping IndexNow
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: python src/indexnow.py

      - name: Upload trend report
        uses: actions/upload-artifact@v4
        with:
          name: trend-report
          path: trend-report.md
          if-no-files-found: ignore
