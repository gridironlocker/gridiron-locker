<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Action Room | Gridiron Locker</title><style>
:root{color-scheme:dark;--bg:#070c15;--panel:#0e1826;--line:#263950;--ink:#eef3fb;--muted:#8fa1bd;--blue:#79c6ff;--green:#5fe0ac;--orange:#ffb15a;--red:#ff8181}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% -10%,#17304b,transparent 35rem),var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1180px;margin:auto;padding:28px 20px 50px}h1{font-size:36px;margin:0}.sub{color:var(--muted);margin:5px 0 25px}.top{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:18px}.hero,.card{background:rgba(14,24,38,.94);border:1px solid var(--line);border-radius:16px;padding:18px}.hero h2{margin:0 0 8px;color:var(--blue);font-size:25px}.score{font-size:42px;font-weight:800;float:right}.meta{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card h2{margin:7px 0;color:var(--blue);font-size:21px}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#17334a;color:var(--blue);font-weight:800;font-size:11px;margin-right:6px}.publish{background:#164332;color:var(--green)}.improve{background:#493816;color:var(--orange)}.gap{background:#4a2c2c;color:var(--red)}.monitor{background:#26303d;color:#b6c4d7}.product a{color:var(--blue)}footer{margin-top:22px;color:var(--muted);font-size:12px}@media(max-width:760px){.top,.grid{grid-template-columns:1fr}.score{float:none}}
</style></head><body><main><h1>⚡ ACTION ROOM</h1><p class="sub">HEADLINE → SIGNAL → TREND → OPPORTUNITY → PRODUCT → ACTION</p><section id="top" class="top"></section><section id="grid" class="grid"></section><footer id="foot">Loading live repo signals…</footer></main><script>
const TEAMS={"cleveland-browns":"Cleveland Browns","green-bay-packers":"Green Bay Packers","michigan":"Michigan Wolverines","dallas-cowboys":"Dallas Cowboys"};
const W={trend:.25,search:.20,fan:.15,competition:.15,product:.15,commercial:.10};
const stop=new Set('the and for with from this that are was were have has had your you our their about into today game games week watch live what when where how who why'.split(' '));
const norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
function phrases(items){const c={}; for(const x of items){const w=norm(x.text).split(' ').filter(a=>a.length>2&&!stop.has(a)); for(const n of [2,3])for(let i=0;i<=w.length-n;i++){const p=w.slice(i,i+n).join(' ');c[p]=(c[p]||0)+1}} return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5)}
function products(data){const arr=[]; if(Array.isArray(data))return data; for(const [slug,p] of Object.entries(data||{})){arr.push({slug,title:p.title||slug,desc:p.desc||'',team:p.col||p.collection||'',url:'/shop/'+slug+'/'})} return arr}
async function load(){const base='../../../'; const [tr,sig,pr]=await Promise.all([fetch(base+'data/trends.json?'+Date.now()).then(r=>r.json()),fetch(base+'marketing/social-signals.json?'+Date.now()).then(r=>r.json()).catch(()=>({})),fetch(base+'data/products_live.json?'+Date.now()).then(r=>r.json()).catch(()=>({}))]); const all=[]; for(const [src,p] of Object.entries(sig.sources||{}))for(const i of p.items||[])all.push({source:src,team:i.team,text:i.text||''}); for(const [team,c] of Object.entries(tr.collections||{}))for(const h of (c.headlines||[]).slice(0,20))all.push({source:'snapshot',team,text:h.title||''}); const ps=products(pr); const acts=[]; for(const [team,label] of Object.entries(TEAMS)){const col=(tr.collections||{})[team]||{};const em=Object.entries(col.entity_mentions||{}).sort((a,b)=>Number(b[1])-Number(a[1]));const ti=all.filter(x=>x.team===team);const ph=phrases(ti);const topic=ph[0]?.[0]||em[0]?.[0]||label;const candidates=ps.filter(p=>norm(p.team).includes(norm(team).split('-')[0])||norm(p.desc+' '+p.title).includes(norm(label).split(' ')[0]));let product=candidates.find(p=>norm(p.title+' '+p.desc).includes(topic.split(' ')[0]))||candidates[0];const trend=Math.min(100,Number(em[0]?.[1]||0)*3);const fan=Math.min(100,Number(ph[0]?.[1]||0)*20);const prod=product?65:0;const score=Math.round(trend*W.trend+Math.min(100,trend+10)*W.search+fan*W.fan+50*W.competition+prod*W.product+(product?70:30)*W.commercial);const confidence=Math.min(90,35+(em.length?15:0)+(ph.length?15:0)+(product?15:0)+(Object.keys(sig.sources||{}).length?15:0));const decision=score>=70&&product?'PUBLISH':score>=55&&product?'IMPROVE':score>=55?'DESIGN GAP':'MONITOR';acts.push({team,label,topic,score,confidence,decision,product,phrase:ph[0]?.[0]||'none captured',evidence:ti.length})} acts.sort((a,b)=>b.score-a.score);const top=acts[0];document.getElementById('top').innerHTML=`<div class="hero"><span class="badge ${top.decision.toLowerCase().replace(' ','')}">${top.decision}</span><span class="score">${top.score}</span><h2>${top.label}</h2><div><b>ACT NOW:</b> ${top.topic}</div><p class="meta">Fan phrase: <b>${top.phrase}</b> · Confidence ${top.confidence}% · ${top.evidence} signals</p>${top.product?`<div class="product">Matched product: <a href="${top.product.url}">${top.product.title}</a></div>`:'<div class="meta">No strong product match — design gap.</div>'}</div><div class="hero"><h2>Decision rule</h2><p>Only PUBLISH when the opportunity has evidence <b>and</b> a relevant product. IMPROVE means fix the hook/content. DESIGN GAP means consider a new product. MONITOR means wait for stronger evidence.</p><p class="meta">Weights: trend 25% · search 20% · fan 15% · competition 15% · product 15% · commercial 10%</p></div>`;document.getElementById('grid').innerHTML=acts.map(a=>`<article class="card"><span class="badge ${a.decision.toLowerCase().replace(' ','')}">${a.decision}</span><span class="score">${a.score}</span><h2>${a.label}</h2><div><b>${a.topic}</b></div><p class="meta">Fan phrase: ${a.phrase}</p><p class="product">${a.product?`Product: <a href="${a.product.url}">${a.product.title}</a>`:'Product: no match'}</p><small class="meta">Confidence ${a.confidence}% · Evidence ${a.evidence}</small></article>`).join('');document.getElementById('foot').textContent='Live data loaded from the repository · trend snapshot: '+(tr.generated||'unknown')+' · '+new Date().toISOString()}
load().catch(e=>document.getElementById('foot').textContent='Action Room could not load live signals: '+e.message);
</script></body></html>
